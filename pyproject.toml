[project]
name = "godot-mcp"
version = "0.1.0"
description = "Offline MCP server for Godot 4 documentation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "docutils>=0.20",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "networkx>=3.0",
]

[project.scripts]
godot-mcp = "src.godot_docs.server:main"
index-godot-docs = "scripts.index_docs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_docs"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
